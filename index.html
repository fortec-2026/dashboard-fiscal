<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle fiscal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

:root{
  --bg:#090d1f; --surface:#10163a; --surface-2:#161d47; --ink:#eaedff; --muted:#8c94c4;
  --line:#232b5c; --line-strong:#39437f; --stripe:#131a40; --track:#1e2654;
  --ok:#3fe3ae; --ok-bg:rgba(63,227,174,.14); --parc:#ffc857; --parc-bg:rgba(255,200,87,.14);
  --pend:#ff6b8b; --pend-bg:rgba(255,107,139,.14); --na:#5a6394; --na-bg:rgba(90,99,148,.2);
  --lr:#9b8cff; --lp:#ff9a4d; --sn:#38c8ff;
  --t0:#eaedff; --t1:#38e1ff;
  --e1:#c6f24a; --e2:#ff6fd8; --e3:#ffd84d; --e4:#2fe0c2; --e5:#ff8fa3; --e6:#b8c0ff;
  --glow:1;
  --disp:'Chakra Petch','IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef0fb; --surface:#ffffff; --surface-2:#f5f6fd; --ink:#131a3d; --muted:#5b6390;
  --line:#dadef2; --line-strong:#b9c0e2; --stripe:#f4f6fd; --track:#e3e6f5;
  --ok:#0f9a6c; --ok-bg:#dcf5ea; --parc:#b97a0c; --parc-bg:#fbefd3;
  --pend:#c9304f; --pend-bg:#fde4ea; --na:#8a91b5; --na-bg:#eceef7;
  --lr:#6a59d1; --lp:#cf5f17; --sn:#0f86c9;
  --t0:#131a3d; --t1:#0aa3c7;
  --e1:#5e8a00; --e2:#c93aa6; --e3:#a07800; --e4:#0a8f7a; --e5:#c9304f; --e6:#4b57b8;
  --glow:0;
}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 480px at 12% -8%,rgba(56,225,255,calc(.13*var(--glow))),transparent 62%),
    radial-gradient(820px 520px at 96% 4%,rgba(164,147,255,calc(.16*var(--glow))),transparent 62%),
    linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 56px,
    linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/56px 100%;
  opacity:.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
h2{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.2px}

/* ── Barra superior ───────────────────────────────────────── */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:20px;padding:10px 24px 0;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.3px;white-space:nowrap;padding-bottom:10px}
.brand span{color:var(--t1)}
.nav{display:flex;gap:2px;align-self:flex-end;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{font-family:var(--disp);padding:9px 14px 11px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--c,var(--t1));text-shadow:0 0 calc(14px*var(--glow)) var(--c,var(--t1))}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:10px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;margin-right:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--na);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 calc(8px*var(--glow)) var(--ok)}
.dot.err{background:var(--pend)}
.dot.load{background:var(--parc);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{border:1px solid var(--line-strong);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--t1)}

.months{display:flex;gap:2px;padding:6px 24px 8px;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:thin}
.months button{font-family:var(--disp);font-weight:500;font-size:13px;padding:4px 12px;border-radius:6px;color:var(--muted);white-space:nowrap}
.months button:hover{color:var(--ink);background:var(--surface)}
.months button[aria-pressed="true"]{background:var(--t1);color:#06122a;font-weight:600;box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--t1) 55%,transparent)}
:root[data-theme="light"] .months button[aria-pressed="true"]{color:#fff}
.months button.sem-aba{opacity:.4}

/* ── Página ───────────────────────────────────────────────── */
main{max-width:1480px;margin:0 auto;padding:24px 24px 60px}
.head{margin-bottom:18px}
.head h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:.2px}
.head p{color:var(--muted);margin-top:4px;font-size:13px}

.avisos{display:grid;gap:6px;margin-bottom:14px}
.avisos:empty{display:none}
.aviso{border-left:3px solid var(--parc);background:var(--parc-bg);padding:8px 12px;font-size:13px;border-radius:0 8px 8px 0}
.aviso.erro{border-left-color:var(--pend);background:var(--pend-bg)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:14px}

.regimes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.reg{display:block;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface) 55%);border:1px solid var(--line);border-radius:14px;padding:14px 18px 16px;width:100%}
.reg:hover{border-color:var(--c)}
.reg-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.reg-name{font-family:var(--disp);font-weight:600;color:var(--c)}
.reg-n{font-family:var(--disp);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.reg-sub{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:8px}

/* ── Barras segmentadas ───────────────────────────────────── */
.seg{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--track)}
.seg i{display:block;height:100%}
.seg .ok{background:var(--ok)}
.seg .parc{background:var(--parc)}
.seg .pend{background:transparent}
.seg .na{background:repeating-linear-gradient(135deg,var(--na) 0 2px,transparent 2px 5px)}

/* ── Painel principal: órbitas ────────────────────────────── */
.painel{display:grid;grid-template-columns:auto minmax(260px,1fr) minmax(300px,1.15fr);gap:10px 30px;align-items:center;padding:22px 26px;margin-bottom:14px}
.orbita{width:270px;max-width:100%}
.orbita svg{display:block;width:100%;height:auto;overflow:visible}
.arco{fill:none;stroke-linecap:round;filter:drop-shadow(0 0 calc(5px*var(--glow)) currentColor)}
.arco.parc{opacity:.38;filter:none}
.trilho{fill:none;stroke:var(--track)}
.apagado{opacity:.22}
.o-num{font-family:var(--disp);font-weight:700;fill:var(--ink)}
.o-rot{fill:var(--muted);font-family:var(--sans)}
body.entrada .arco{animation:desenha 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes desenha{from{stroke-dasharray:0 100}}

.legenda{display:grid;gap:2px}
.legenda.densa .leg{padding:4px 10px}
.legenda.densa .leg strong{font-size:14px}
.leg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 48px;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:8px;border:1px solid transparent}
.leg:hover{background:var(--surface-2)}
.leg.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.leg i{width:12px;height:12px;border-radius:50%;background:var(--tc);box-shadow:0 0 calc(8px*var(--glow)) var(--tc)}
.leg b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg span{color:var(--muted);font-size:12px;white-space:nowrap}
.leg strong{font-family:var(--disp);font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.r-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.r-nota{color:var(--muted);font-size:12px;margin-top:10px;max-width:60ch}

.chip{border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:7px;background:var(--surface);white-space:nowrap}
.chip:hover{border-color:var(--t1)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.chip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.sw.ok{background:var(--ok)} .sw.pend{background:var(--pend)} .sw.na{background:var(--na)}

.evol{min-width:0}
.evol p{color:var(--muted);font-size:12px;margin:2px 0 6px}
.evol svg{display:block;width:100%;height:auto;overflow:visible}
.e-grade{stroke:var(--line);stroke-width:1}
.e-eixo{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.e-linha{fill:none;stroke:var(--t1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 calc(6px*var(--glow)) var(--t1))}
.e-ponto{fill:var(--surface);stroke:var(--t1);stroke-width:2;cursor:pointer}
.e-ponto.atual{fill:var(--t1)}
.e-val{fill:var(--ink);font-family:var(--disp);font-weight:600;font-size:11px;text-anchor:middle}
.e-mes{cursor:pointer}
.e-mes.atual{fill:var(--t1);font-weight:600}
.e-mes.futuro{opacity:.4;cursor:default}

/* ── Equipes e pessoas ────────────────────────────────────── */
.sec-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:22px 2px 10px}
.sec-head p{color:var(--muted);font-size:13px}
.sec-head .btn{margin-left:auto}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;align-items:start;margin-bottom:14px}
.time{border-top:2px solid var(--tc);padding-bottom:6px;overflow:hidden}
.time-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:baseline;width:100%;text-align:left;padding:9px 14px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
button.time-head:hover,.time-head.on{background:color-mix(in srgb,var(--tc) 12%,transparent)}
.time-head b{font-family:var(--disp);font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time-head small{grid-column:1/-1;color:var(--muted);font-size:11px}
.time-head .eq-pct{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--tc);font-variant-numeric:tabular-nums}
.pes{display:grid;grid-template-columns:22px minmax(0,1fr) auto 40px;gap:9px;align-items:center;width:100%;text-align:left;padding:4px 14px 4px 11px;border-left:3px solid transparent}
.pes:hover{background:var(--surface-2)}
.pes.on{border-left-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.pes svg{width:22px;height:22px;overflow:visible}
.pes .arco{filter:none}
.pes-nome{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pes.on .pes-nome{font-weight:600}
.pes-sub{color:var(--muted);font-size:11px;white-space:nowrap}
.pes-pct{font-family:var(--disp);font-weight:600;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

/* ── Tabela ───────────────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:8px;padding:14px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.toolbar .conta{font-family:var(--disp);font-weight:600;font-size:16px;margin-right:auto;white-space:nowrap}
.busca{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;padding:6px 11px;width:260px;max-width:100%}
.busca::placeholder{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--stripe)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
th.c,td.c{text-align:center}
.t-cod{font-family:var(--disp);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.t-nome{font-weight:500;min-width:190px}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
.t-nome small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.t-sub{color:var(--muted);white-space:nowrap}
.f-ok{color:var(--ok);font-weight:600;font-size:15px}
.f-pend{color:var(--line-strong);font-weight:600}
.f-txt{font-size:11px;color:var(--muted);white-space:nowrap}
.f-txt.pend{color:var(--parc);font-weight:500}
.prog{display:flex;align-items:center;gap:6px;min-width:84px}
.prog .seg{flex:1;height:5px}
.prog span{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums;width:38px;text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.concluido{background:var(--ok-bg);color:var(--ok)}
.pill.parcial{background:var(--parc-bg);color:var(--parc)}
.pill.pendente{background:var(--pend-bg);color:var(--pend)}
.pill.na{background:var(--na-bg);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.vazio{padding:46px 20px;text-align:center;color:var(--muted)}
.vazio strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.vazio .btn{margin-top:12px}
.print-head{display:none}

/* ── Tela de senha ────────────────────────────────────────── */
.trava{min-height:100vh;display:grid;place-items:center;padding:24px}
.trava-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ok);border-radius:6px;padding:28px 28px 26px;width:100%;max-width:360px;display:grid;gap:10px}
.trava-card h1{font-family:var(--cond);font-weight:600;font-size:24px;letter-spacing:-.2px}
.trava-card p{color:var(--muted);font-size:13px;margin-bottom:6px}
.trava-card p.erro{color:var(--pend);font-weight:500}
.trava-card label{font-size:13px;font-weight:500}
.trava-card .busca{width:100%;padding:9px 11px;font-size:15px}
.trava-check{display:flex;align-items:center;gap:8px;font-weight:400!important;color:var(--muted)}
.trava-btn{background:var(--ink);color:var(--surface);border-radius:6px;padding:10px;font-weight:600;margin-top:6px}
.trava-btn:disabled{opacity:.6;cursor:default}

@media (max-width:1100px){
  .painel{grid-template-columns:auto minmax(0,1fr)}
  .evol{grid-column:1/-1;margin-top:8px}
}
@media (max-width:700px){
  .top{position:static}
  .top-row{padding:8px 14px 0;gap:8px 14px}
  .nav{order:3;width:100%}
  .tools{padding-bottom:6px}
  .status .quando{display:none}
  .months{padding:6px 14px 8px}
  main{padding:16px 14px 50px}
  .head h1{font-size:23px}
  .regimes{grid-template-columns:1fr}
  .painel{grid-template-columns:1fr;padding:18px 16px;justify-items:center}
  .painel>div{width:100%}
  .orbita{width:220px!important}
  .busca{width:100%}
  .toolbar .conta{width:100%}
}
@media (prefers-reduced-motion:reduce){.dot.load{animation:none} body.entrada .arco{animation:none}}

@media print{
  @page{size:A4 landscape;margin:10mm}
  :root,:root[data-theme="light"]{--bg:#fff;--surface:#fff;--surface-2:#fff;--ink:#000;--muted:#444;--line:#ccc;--line-strong:#999;--stripe:#f2f3f8;--track:#ddd;--ok:#14633c;--ok-bg:#e2f2e8;--parc:#8a5a00;--parc-bg:#fbefd3;--pend:#a02d1c;--pend-bg:#fbe6e1;--na:#888;--na-bg:#eee;--glow:0}
  body{font-size:10px}
  body::before{display:none}
  .top,.painel,.equipes,.regimes,.toolbar,.avisos,.head{display:none!important}
  main{padding:0;max-width:none}
  .box{border:0}
  .print-head{display:block;margin-bottom:8px}
  .print-head h1{font-family:var(--disp);font-size:15px}
  .print-head p{color:#444;font-size:10px}
  table{font-size:9.5px}
  thead th,tbody td{padding:3px 6px}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  .tbl-wrap{overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<script>try{if(localStorage.getItem('controle-fiscal-tema')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
</head>
<body>

<div class="trava" id="trava">
  <form class="trava-card" id="trava-form" autocomplete="on">
    <h1>Controle fiscal</h1>
    <p id="trava-msg">Digite a senha do escritório para abrir o painel.</p>
    <input type="text" name="username" value="escritorio" autocomplete="username" hidden>
    <label for="trava-senha">Senha</label>
    <input class="busca" id="trava-senha" name="password" type="password" autocomplete="current-password" required>
    <label class="trava-check"><input type="checkbox" id="trava-lembrar" checked> Lembrar neste computador</label>
    <button class="trava-btn" id="trava-btn" type="submit">Entrar</button>
  </form>
</div>

<header class="top" hidden>
  <div class="top-row">
    <div class="brand">Controle fiscal <span id="ano"></span></div>
    <nav class="nav" id="nav" aria-label="Painéis"></nav>
    <div class="tools">
      <div class="status" id="status" title="A página busca as planilhas sozinha a cada 5 minutos">
        <span class="dot" id="dot"></span><span id="status-txt">Conectando</span>
      </div>
      <button class="btn" data-acao="atualizar">Atualizar agora</button>
      <button class="btn" data-acao="tema" id="btn-tema">Tema claro</button>
      <button class="btn" data-acao="sair" title="Esquece a senha neste computador">Sair</button>
    </div>
  </div>
  <div class="months" id="months" role="group" aria-label="Mês de referência"></div>
</header>

<main hidden>
  <div class="head">
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </div>
  <div class="avisos" id="avisos"></div>
  <div class="regimes" id="regimes" hidden></div>

  <section class="painel box" aria-label="Desempenho">
    <div class="orbita" id="orbita"></div>
    <div>
      <div class="legenda" id="legenda"></div>
      <div class="r-chips" id="chips"></div>
      <p class="r-nota" id="nota"></p>
    </div>
    <div class="evol">
      <h2>Evolução no ano</h2>
      <p id="evol-sub"></p>
      <div id="evolucao"></div>
    </div>
  </section>

  <section class="equipes" aria-label="Equipes e pessoas">
    <div class="sec-head">
      <h2>Equipes e pessoas</h2>
      <p>Clique em uma equipe ou pessoa para ver só a carteira dela.</p>
      <button class="btn" id="ver-todos" data-pessoa="" hidden>Voltar para todos</button>
    </div>
    <div class="times" id="people"></div>
  </section>

  <section class="box">
    <div class="toolbar">
      <span class="conta" id="conta"></span>
      <span id="flags" style="display:contents"></span>
      <input class="busca" id="busca" type="search" placeholder="Buscar empresa, código ou responsável" aria-label="Buscar">
      <button class="btn" data-acao="imprimir">Imprimir lista</button>
    </div>
    <div class="print-head"><h1 id="p-titulo"></h1><p id="p-sub"></p></div>
    <div class="tbl-wrap" id="tabela"></div>
  </section>
</main>

<noscript><p style="padding:24px">Este painel precisa de JavaScript ativado no navegador.</p></noscript>

<script>

function iniciarPainel(CONFIG) {
'use strict';

var MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
var MES_CURTO = {JAN:'Jan',FEV:'Fev',MAR:'Mar',ABR:'Abr',MAI:'Mai',JUN:'Jun',JUL:'Jul',AGO:'Ago',SET:'Set',OUT:'Out',NOV:'Nov',DEZ:'Dez'};
var MES_NOME  = {JAN:'janeiro',FEV:'fevereiro',MAR:'março',ABR:'abril',MAI:'maio',JUN:'junho',JUL:'julho',AGO:'agosto',SET:'setembro',OUT:'outubro',NOV:'novembro',DEZ:'dezembro'};
var REGIMES = ['lr','lp','sn'];
var VISOES = { todos:'Visão geral', lr:CONFIG.regimes.lr.nome, lp:CONFIG.regimes.lp.nome, sn:CONFIG.regimes.sn.nome };
var INTERVALO = CONFIG.minutosEntreAtualizacoes * 60 * 1000;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cel(l, i){ return (l && i != null && i >= 0 && l[i] != null) ? String(l[i]).trim() : ''; }
function semAcento(s){ return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function hora(ts){ return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function plural(n, um, varios){ return n + ' ' + (n === 1 ? um : varios); }
function nomePessoa(s){
  if (s === 'SEM RESP') return 'Sem responsável';
  return s.toLowerCase().replace(/(^|[\s\-\/.])([a-zà-ÿ])/g, function(m, a, b){ return a + b.toUpperCase(); });
}

// ── Estado ────────────────────────────────────────────────────────────────
function mesPadrao(){
  var i = new Date().getMonth() - 1;   // mês anterior ao atual, que é o que está sendo fechado
  return MESES[i < 0 ? 11 : i];
}
var state = { view:'todos', mes:mesPadrao(), sel:null, status:'todos', flags:{}, busca:'' };
var cache = {};          // "lr:SET" → { registros, titulo, em, erro, carregando, txt }
var ultimaBusca = {};    // "SET" → timestamp da última tentativa

// ── Leitura de CSV ────────────────────────────────────────────────────────
function parseCSV(t){
  var rows = [], row = [], f = '', q = false, c;
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  for (var i = 0; i < t.length; i++) {
    c = t[i];
    if (q) {
      if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function urlAba(regime, mes){
  var r = CONFIG.regimes[regime], gid = r.abas[mes];
  if (gid == null) return null;
  return 'https://docs.google.com/spreadsheets/d/e/' + r.planilha + '/pub?gid=' + gid + '&single=true&output=csv';
}

// ── Regras de cada planilha (iguais às dos painéis antigos) ───────────────
function fechar(reg){
  var apl = 0, ok = 0;
  reg.campos.forEach(function(c){ if (c.estado !== 'na') { apl++; if (c.estado === 'ok') ok++; } });
  reg.pct = apl ? Math.round(ok / apl * 100) : 0;
  reg.status = !apl ? 'na' : reg.pct === 100 ? 'concluido' : reg.pct > 0 ? 'parcial' : 'pendente';
  return reg;
}

var PARSERS = {
  lr: function(linhas){
    var SIM = ['TRUE','VERDADEIRO','V','SIM'];
    var IGN = ['N/A','N.A.','TERCEIRO','I.E. SUSP','I.E. SUSP.'];
    var cab = linhas[1] || [], idx = {};
    cab.forEach(function(h, i){ idx[String(h).trim()] = i; });
    var out = [];
    for (var r = 2; r < linhas.length; r++) {
      var l = linhas[r], cod = cel(l, idx['CÓD']), nome = cel(l, idx['RAZÃO SOCIAL']);
      if (!cod && !nome) continue;
      var campos = ['EFD ICMS','EFD P/C','ENVIO'].map(function(rot){
        var v = cel(l, idx[rot]), up = v.toUpperCase();
        if (v === '' || IGN.indexOf(up) >= 0) return { rot:rot, estado:'na', txt:v };
        if (SIM.indexOf(up) >= 0) return { rot:rot, estado:'ok', txt:'' };
        return { rot:rot, estado:'pend', txt:(up === 'FALSE' || up === 'FALSO') ? '' : v };
      });
      var envio = cel(l, idx['ENVIO']).toUpperCase();
      out.push(fechar({
        regime:'lr', cod:cod, nome:nome,
        resp:(cel(l, idx['RESP']) || 'SEM RESP').toUpperCase(),
        cidade:cel(l, idx['CIDADE']), uf:cel(l, idx['UF']),
        atividade:cel(l, idx['ATIVIDADE']), matFil:cel(l, idx['MAT/FIL']),
        campos:campos, enviado:campos[2].estado === 'ok', envioDispensado:IGN.indexOf(envio) >= 0
      }));
    }
    return { titulo: cel(linhas[0], 0), registros: out };
  },

  lp: function(linhas, mes){
    var SIM = ['TRUE','VERDADEIRO','V','SIM','X'];
    var IGN = ['N/A','N.A.','TERCEIRO','I.E. SUSP','I.E. SUSP.','NA'];
    var cfg = CONFIG.regimes.lp.colunaResponsavel;
    var colResp = cfg[mes] != null ? cfg[mes] : cfg.padrao;
    var cab = linhas[1] || [], idx = {};
    cab.forEach(function(h, i){ idx[String(h).trim()] = i; });
    var iCod = idx['CÓD.'] != null ? idx['CÓD.'] : idx['CÓD'] != null ? idx['CÓD'] : 0;
    var iNome = idx['RAZÃO SOCIAL'] != null ? idx['RAZÃO SOCIAL'] : 1;
    var iCid = idx['MUNIC.'] != null ? idx['MUNIC.'] : idx['CIDADE'];
    var out = [];
    for (var r = 2; r < linhas.length; r++) {
      var l = linhas[r], cod = cel(l, iCod), nome = cel(l, iNome);
      if (!cod && !nome) continue;
      var campos = ['EFD ICMS/IPI','EFD PIS/COFINS','ENVIO'].map(function(rot){
        var v = cel(l, idx[rot]), up = v.toUpperCase();
        if (v === '' || IGN.indexOf(up) >= 0) return { rot:rot, estado:'na', txt:v };
        if (SIM.indexOf(up) >= 0) return { rot:rot, estado:'ok', txt:'' };
        return { rot:rot, estado:'pend', txt:(up === 'FALSE' || up === 'FALSO') ? '' : v };
      });
      out.push(fechar({
        regime:'lp', cod:cod, nome:nome,
        resp:cel(l, colResp).toUpperCase() || 'SEM RESP',
        cidade:cel(l, iCid), uf:cel(l, idx['UF']), atividade:'', matFil:'',
        campos:campos, enviado:campos[2].estado === 'ok', envioDispensado:campos[2].estado === 'na'
      }));
    }
    return { titulo: cel(linhas[0], 0), registros: out };
  },

  sn: function(linhas){
    var SIM = ['TRUE','VERDADEIRO','V','SIM','X','✔','1'];
    var lh = -1, i;
    for (i = 0; i < Math.min(linhas.length, 5); i++) {
      var junto = linhas[i].join(' ').toUpperCase();
      if (junto.indexOf('CÓDIGO') >= 0 || junto.indexOf('CODIGO') >= 0 || junto.indexOf('EMPRESA') >= 0) { lh = i; break; }
    }
    if (lh < 0) lh = 1;
    var titulo = '';
    for (i = 0; i < lh; i++) { if (cel(linhas[i], 0)) { titulo = cel(linhas[i], 0); break; } }
    var idx = {};
    (linhas[lh] || []).forEach(function(h, k){ idx[semAcento(String(h).trim())] = k; });
    function col(nomes){ for (var n = 0; n < nomes.length; n++) { var k = semAcento(nomes[n]); if (idx[k] != null) return idx[k]; } return -1; }
    var iCod = col(['CÓDIGO','COD.','COD']), iNome = col(['EMPRESA','RAZÃO SOCIAL','NOME']);
    var iResp = col(['RESPONSÁVEL','RESP']), iEnv = col(['ENVIADO','ENVIO','SENT']);
    var out = [];
    for (var r = lh + 1; r < linhas.length; r++) {
      var l = linhas[r], cod = cel(l, iCod), nome = cel(l, iNome);
      if (!cod && !nome) continue;
      var resp = cel(l, iResp).toUpperCase(), env = cel(l, iEnv).toUpperCase();
      var na = SN_NA.indexOf(env) >= 0 || SN_NA.indexOf(resp) >= 0;
      var ok = !na && SIM.indexOf(env) >= 0;
      out.push(fechar({
        regime:'sn', cod:cod, nome:nome, resp:resp || 'SEM RESP',
        cidade:'', uf:'', atividade:'', matFil:'',
        campos:[{ rot:'Enviado', estado: na ? 'na' : ok ? 'ok' : 'pend', txt: na ? (SN_NA.indexOf(env) >= 0 ? env : resp) : '' }],
        enviado:ok, envioDispensado:na
      }));
    }
    return { titulo: titulo, registros: out };
  }
};
// No Simples, estes valores (na coluna Enviado ou Responsável) tiram a empresa da conta
var SN_NA = ['DEVOLVIDA','DEVOLVIDO','BAIXADA','BAIXADO','SEM RESP','N/A','N.A.','NA'];

// ── Busca das planilhas ───────────────────────────────────────────────────
function baixar(regime, mes){
  var url = urlAba(regime, mes), chave = regime + ':' + mes;
  if (!url) return Promise.resolve(false);
  var ent = cache[chave] || (cache[chave] = {});
  ent.carregando = true;
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var relogio = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 25000);
  var mudou = false;
  return fetch(url, { cache:'no-store', signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error('resposta ' + r.status); return r.text(); })
    .then(function(txt){
      if (/^\s*<(!doctype|html)/i.test(txt)) throw new Error('a planilha não está publicada como CSV');
      mudou = ent.txt !== txt || !!ent.erro;
      if (ent.txt !== txt) {
        var res = PARSERS[regime](parseCSV(txt), mes);
        ent.registros = res.registros; ent.titulo = res.titulo; ent.txt = txt;
      }
      ent.em = Date.now(); ent.erro = null;
    })
    .catch(function(e){
      mudou = true;
      ent.erro = (e && e.name === 'AbortError') ? 'a planilha demorou demais para responder'
        : (e && e.name === 'TypeError') ? 'sem conexão com o Google Planilhas'
        : ((e && e.message) || 'falha de conexão');
    })
    .then(function(){ clearTimeout(relogio); ent.carregando = false; return mudou; });
}

function carregarMes(mes, silencioso){
  ultimaBusca[mes] = Date.now();
  var pedidos = REGIMES.map(function(g){
    return baixar(g, mes).then(function(mudou){
      if (mes !== state.mes) return;
      if (mudou || !silencioso) render(); else renderStatus();
    });
  });
  renderStatus();
  return Promise.all(pedidos);
}

// ── Seleção e contas ──────────────────────────────────────────────────────
function regimesDaVisao(){ return state.view === 'todos' ? REGIMES : [state.view]; }
function entrada(g){ return cache[g + ':' + state.mes]; }
function registrosDaVisao(){
  var out = [];
  regimesDaVisao().forEach(function(g){ var e = entrada(g); if (e && e.registros) out = out.concat(e.registros); });
  return out;
}
function equipePorNome(n){ for (var i = 0; i < CONFIG.equipes.length; i++) if (CONFIG.equipes[i].nome === n) return CONFIG.equipes[i]; return null; }
function membros(eq){ return [eq.lider].concat(eq.liderados); }
function foraDaLista(r){ return r.regime === 'sn' && SN_NA.indexOf(r.resp) >= 0; }

function porSelecao(rs){
  var s = state.sel;
  if (!s) return rs;
  if (s.tipo === 'pessoa') return rs.filter(function(r){ return r.resp === s.nome; });
  if (s.tipo === 'outros') {
    var emEquipe = {};
    CONFIG.equipes.forEach(function(e){ membros(e).forEach(function(n){ emEquipe[n] = 1; }); });
    return rs.filter(function(r){ return r.regime === s.nome && !emEquipe[r.resp] && !foraDaLista(r); });
  }
  var eq = equipePorNome(s.nome);
  if (!eq) return rs;
  var m = membros(eq);
  return rs.filter(function(r){ return m.indexOf(r.resp) >= 0; });
}
function contar(rs){
  var c = { total:0, concluido:0, parcial:0, pendente:0, na:0 };
  rs.forEach(function(r){ c.total++; c[r.status]++; });
  c.aplic = c.total - c.na;
  c.abertos = c.parcial + c.pendente;
  c.pct = c.aplic ? Math.round(c.concluido / c.aplic * 100) : 0;
  return c;
}
function barra(c, classe, base){
  var t = base || c.total || 1;
  function s(k, n){ return n ? '<i class="' + k + '" style="width:' + (n / t * 100) + '%"></i>' : ''; }
  return '<div class="seg' + (classe ? ' ' + classe : '') + '" role="img" aria-label="' +
    c.concluido + ' concluídos, ' + c.parcial + ' parciais, ' + c.pendente + ' pendentes, ' + c.na + ' não se aplicam">' +
    s('ok', c.concluido) + s('parc', c.parcial) + s('pend', c.pendente) + s('na', c.na) + '</div>';
}
function rotuloSel(){
  var s = state.sel;
  if (!s) return 'Todos os responsáveis';
  if (s.tipo === 'pessoa') return 'Carteira de ' + nomePessoa(s.nome);
  if (s.tipo === 'outros') return 'Outros responsáveis, ' + (CONFIG.regimes[s.nome] ? CONFIG.regimes[s.nome].nome : '');
  var eq = equipePorNome(s.nome);
  return s.nome + (eq ? ', ' + plural(membros(eq).length, 'pessoa', 'pessoas') : '');
}

// ── Desenho ───────────────────────────────────────────────────────────────
function renderNav(){
  $('nav').innerHTML = Object.keys(VISOES).map(function(v){
    return '<button data-view="' + v + '"' + (v !== 'todos' ? ' style="--c:var(--' + v + ')"' : '') +
      (state.view === v ? ' aria-current="page"' : '') + '>' + esc(VISOES[v]) + '</button>';
  }).join('');
  $('months').innerHTML = MESES.map(function(m){
    var tem = regimesDaVisao().some(function(g){ return urlAba(g, m); });
    return '<button data-mes="' + m + '" aria-pressed="' + (state.mes === m) + '"' + (tem ? '' : ' class="sem-aba" title="Sem planilha neste mês"') + '>' + MES_CURTO[m] + '</button>';
  }).join('');
  var faixa = $('months'), ativo = faixa.querySelector('[aria-pressed="true"]');
  if (ativo) faixa.scrollLeft = ativo.offsetLeft - faixa.clientWidth / 2 + ativo.offsetWidth / 2;
}

function renderCabecalho(){
  var t = VISOES[state.view] + ', ' + MES_NOME[state.mes] + ' de ' + CONFIG.ano;
  $('titulo').textContent = t;
  document.title = t;
  var sub = rotuloSel();
  if (state.view !== 'todos') { var e = entrada(state.view); if (e && e.titulo) sub += '. Planilha: ' + e.titulo; }
  $('subtitulo').textContent = sub;
}

function renderAvisos(){
  var h = '';
  regimesDaVisao().forEach(function(g){
    var nome = CONFIG.regimes[g].nome, e = entrada(g);
    if (!urlAba(g, state.mes)) {
      var tem = MESES.filter(function(m){ return urlAba(g, m); });
      h += '<div class="aviso">' + esc(nome) + ' não tem planilha de ' + MES_NOME[state.mes] +
        (tem.length ? '. Os meses disponíveis vão de ' + MES_NOME[tem[0]] + ' a ' + MES_NOME[tem[tem.length - 1]] + '.' : '.') + '</div>';
    } else if (e && e.erro && e.registros) {
      h += '<div class="aviso">Não foi possível atualizar ' + esc(nome) + ' agora (' + esc(e.erro) + '). Os dados mostrados são das ' + hora(e.em) + '.</div>';
    } else if (e && e.erro) {
      h += '<div class="aviso erro">Não foi possível carregar ' + esc(nome) + ' (' + esc(e.erro) + '). Confira se a aba continua publicada em Arquivo, Compartilhar, Publicar na web, e use "Atualizar agora".</div>';
    }
  });
  $('avisos').innerHTML = h;
}

function renderRegimes(){
  var el = $('regimes');
  if (state.view !== 'todos') { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  var todos = porSelecao(registrosDaVisao()).length || 1;
  el.innerHTML = REGIMES.map(function(g){
    var e = entrada(g), rs = e && e.registros ? porSelecao(e.registros) : null;
    var corpo;
    if (!urlAba(g, state.mes)) corpo = '<div class="reg-sub"><span>Sem planilha neste mês</span></div>';
    else if (!rs) corpo = '<div class="reg-sub"><span>' + (e && e.erro ? 'Não carregou' : 'Carregando') + '</span></div>';
    else {
      var c = contar(rs);
      corpo = barra(c) + '<div class="reg-sub"><span>' + c.pct + '% concluído</span><span>' + Math.round(c.total / todos * 100) + '% das empresas</span></div>';
    }
    return '<button class="reg" data-view="' + g + '" style="--c:var(--' + g + ')" aria-label="Abrir painel de ' + esc(CONFIG.regimes[g].nome) + '">' +
      '<div class="reg-top"><span class="reg-name">' + esc(CONFIG.regimes[g].nome) + '</span><span class="reg-n">' + (rs ? rs.length : '–') + '</span></div>' + corpo + '</button>';
  }).join('');
}

// ── Equipes, pessoas e desenhos ───────────────────────────────────────────
function grupos(){
  var mapa = {};
  registrosDaVisao().forEach(function(r){ if (!foraDaLista(r)) (mapa[r.resp] || (mapa[r.resp] = [])).push(r); });
  if (state.sel && state.sel.tipo === 'pessoa' && !mapa[state.sel.nome]) mapa[state.sel.nome] = [];
  var usados = {}, gs = [];
  function monta(nome, sel, cor, ms){
    gs.push({ nome:nome, sel:sel, cor:cor, membros:ms, c:contar(ms.reduce(function(a, m){ return a.concat(m.regs); }, [])) });
  }
  CONFIG.equipes.forEach(function(eq, i){
    var ms = membros(eq).filter(function(n){ return mapa[n]; });
    if (!ms.length) return;
    ms.forEach(function(n){ usados[n] = 1; });
    monta(eq.nome, { tipo:'equipe', nome:eq.nome }, 'var(--e' + (i % 6 + 1) + ')', ms.map(function(n){ return { nome:n, regs:mapa[n] }; }));
  });
  var temEquipe = gs.length > 0;
  function ordem(a, b){
    if (a.nome === 'SEM RESP') return 1; if (b.nome === 'SEM RESP') return -1;
    return b.regs.length - a.regs.length || a.nome.localeCompare(b.nome, 'pt-BR');
  }
  var resto = Object.keys(mapa).filter(function(n){ return !usados[n]; });
  // quem está fora das equipes fica em um grupo por regime, na cor do regime
  regimesDaVisao().forEach(function(g){
    var ms = resto.map(function(n){ return { nome:n, regs:mapa[n].filter(function(r){ return r.regime === g; }) }; })
                  .filter(function(m){ return m.regs.length; }).sort(ordem);
    if (!ms.length) return;
    var nome = state.view === 'todos' ? (temEquipe ? 'Outros, ' : '') + CONFIG.regimes[g].nome : (temEquipe ? 'Outros responsáveis' : 'Responsáveis');
    monta(nome, { tipo:'outros', nome:g }, 'var(--' + g + ')', ms);
  });
  var vazios = resto.filter(function(n){ return !mapa[n].length; });
  if (vazios.length) monta('Sem empresas neste mês', null, 'var(--muted)', vazios.map(function(n){ return { nome:n, regs:[] }; }));
  return { gs:gs };
}

// Um anel: parte cheia = concluído, parte clara = começado, resto = pendente
function arcos(c, cx, r, w, cor, apagado){
  var base = c.aplic || 1, ok = c.concluido / base * 100, parc = c.parcial / base * 100;
  var t = ' transform="rotate(-90 ' + cx + ' ' + cx + ')"', g = ' cx="' + cx + '" cy="' + cx + '" r="' + r + '" stroke-width="' + w + '"';
  return '<g' + (apagado ? ' class="apagado"' : '') + ' style="color:' + cor + '">' +
    '<circle class="trilho"' + g + '/>' +
    (parc > 0.5 ? '<circle class="arco parc" pathLength="100" stroke="currentColor" stroke-dasharray="' + Math.min(ok + parc, 100).toFixed(2) + ' 100"' + g + t + '/>' : '') +
    (ok > 0.5 ? '<circle class="arco" pathLength="100" stroke="currentColor" stroke-dasharray="' + Math.min(ok, 100).toFixed(2) + ' 100"' + g + t + '/>' : '') +
    '</g>';
}
function mesmaSel(a){ return !!(a && state.sel && state.sel.tipo === a.tipo && state.sel.nome === a.nome); }
function attrSel(a){ return (a.tipo === 'equipe' ? 'data-equipe' : 'data-outros') + '="' + esc(a.nome) + '"'; }

function renderPainel(){
  var todos = registrosDaVisao(), G = grupos(), sn = state.view === 'sn';
  var geral = contar(todos), rs = porSelecao(todos), c = contar(rs);
  var aneis = G.gs.filter(function(g){ return g.sel; }).slice(0, 8);
  var emGrupo = state.sel && state.sel.tipo !== 'pessoa';

  // órbitas: anel de fora = todos; para dentro, um anel por equipe e por grupo de outros responsáveis
  var n = aneis.length, w = !n ? 16 : n > 5 ? 7 : 10, passo = n > 5 ? 11.5 : n > 3 ? 15 : 17, r0 = 125 - 6 - w / 2;
  var svg = arcos(geral, 125, r0, w, 'var(--t0)', emGrupo);
  aneis.forEach(function(g, i){ svg += arcos(g.c, 125, r0 - (i + 1) * passo, w, g.cor, emGrupo && !mesmaSel(g.sel)); });
  var rot = !state.sel ? (sn ? 'enviado' : 'concluído') : state.sel.tipo === 'pessoa' ? nomePessoa(state.sel.nome).split(' ')[0]
          : state.sel.tipo === 'outros' ? 'Outros' : state.sel.nome.replace(/^Equipe\s+/i, 'Eq. ');
  $('orbita').innerHTML = '<svg viewBox="0 0 250 250" role="img" aria-label="' + esc(rotuloSel()) + ': ' + c.pct + '% concluído">' + svg +
    '<text class="o-num" x="125" y="' + (n > 5 ? 131 : n > 3 ? 131 : 133) + '" text-anchor="middle" font-size="' + (n > 5 ? 18 : n > 3 ? 24 : n ? 30 : 46) + '">' + (c.aplic ? c.pct + '%' : '–') + '</text>' +

// ── Evolução no ano ───────────────────────────────────────────────────────
function ultimoMesComDados(){
  var hoje = new Date();
  return hoje.getFullYear() > CONFIG.ano ? 11 : hoje.getFullYear() < CONFIG.ano ? -1 : hoje.getMonth();
}
function naEvolucao(g, i){
  var desde = CONFIG.regimes[g].evolucaoAPartirDe;
  return !!urlAba(g, MESES[i]) && (!desde || i >= MESES.indexOf(desde));
}
function renderEvolucao(){
  var lim = ultimoMesComDados(), gs = regimesDaVisao(), pts = [], faltam = 0;
  MESES.forEach(function(m, i){
    if (i > lim) return;
    var regs = [], tem = false, falta = false;
    gs.forEach(function(g){
      if (!naEvolucao(g, i)) return;
      var e = cache[g + ':' + m];
      if (e && e.registros) { regs = regs.concat(e.registros); tem = true; } else if (!e || !e.erro) falta = true;
    });
    if (falta) { faltam++; return; }
    if (!tem) return;
    var c = contar(porSelecao(regs));
    if (c.aplic) pts.push({ m:m, i:i, p:c.pct });
  });
  var L = 30, R = 14, T = 20, B = 26, W = 400, H = 190, iw = W - L - R, ih = H - T - B;
  function X(i){ return L + i * iw / 11; }
  function Y(p){ return T + (1 - p / 100) * ih; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Percentual concluído em cada mês"><defs><linearGradient id="e-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--t1)" stop-opacity=".32"/><stop offset="1" stop-color="var(--t1)" stop-opacity="0"/></linearGradient></defs>';
  [0, 50, 100].forEach(function(v){
    s += '<line class="e-grade" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="e-eixo" x="' + (L - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + v + '</text>';
  });
  MESES.forEach(function(m, i){
    var ok = i <= lim && gs.some(function(g){ return naEvolucao(g, i); });
    s += '<text class="e-eixo e-mes' + (m === state.mes ? ' atual' : '') + (ok ? '' : ' futuro') + '" x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle"' + (ok ? ' data-mes="' + m + '"' : '') + '>' + MES_CURTO[m] + '</text>';
  });
  if (pts.length) {
    var caminho = pts.map(function(p){ return X(p.i).toFixed(1) + ',' + Y(p.p).toFixed(1); });
    if (pts.length > 1) {
      s += '<polygon fill="url(#e-area)" points="' + X(pts[0].i).toFixed(1) + ',' + Y(0) + ' ' + caminho.join(' ') + ' ' + X(pts[pts.length - 1].i).toFixed(1) + ',' + Y(0) + '"/>';
      s += '<polyline class="e-linha" points="' + caminho.join(' ') + '"/>';
    }
    pts.forEach(function(p){
      s += '<text class="e-val" x="' + X(p.i) + '" y="' + (Y(p.p) - 9) + '">' + p.p + '</text>' +
        '<circle class="e-ponto' + (p.m === state.mes ? ' atual' : '') + '" data-mes="' + p.m + '" cx="' + X(p.i) + '" cy="' + Y(p.p) + '" r="' + (p.m === state.mes ? 5 : 4) + '"><title>' + MES_NOME[p.m] + ': ' + p.p + '%</title></circle>';
    });
  }
  $('evolucao').innerHTML = s + '</svg>';
  var snDesde = gs.indexOf('sn') >= 0 ? CONFIG.regimes.sn.evolucaoAPartirDe : null;
  var quem = !state.sel ? 'todos os responsáveis' : state.sel.tipo === 'pessoa' ? nomePessoa(state.sel.nome) : state.sel.tipo === 'outros' ? 'outros responsáveis do ' + CONFIG.regimes[state.sel.nome].nome : state.sel.nome;
  $('evol-sub').textContent = (state.view === 'sn' ? 'Percentual enviado' : 'Percentual concluído') + ' em cada mês, ' + quem + '.' +
    (snDesde ? ' O Simples Nacional entra a partir de ' + MES_NOME[snDesde] + '.' : '') + (faltam ? ' Buscando os meses anteriores.' : '');
}

// Busca os meses anteriores uma vez, em segundo plano, só para desenhar a evolução
var historicoPedido = false;
function carregarHistorico(){
  if (historicoPedido) return;
  historicoPedido = true;
  var lim = ultimoMesComDados(), fila = [];
  for (var i = lim; i >= 0; i--) REGIMES.forEach(function(g){ if (naEvolucao(g, i)) fila.push([g, MESES[i]]); });
  function proximo(){
    var it = fila.shift();
    if (!it) return;
    var e = cache[it[0] + ':' + it[1]];
    if (e && (e.registros || e.carregando)) return proximo();
    baixar(it[0], it[1]).then(function(){ renderEvolucao(); proximo(); });
  }
  proximo(); proximo(); proximo();
}

var FLAGS = {
  lr: [['enviado','Enviadas à contabilidade'],['naoEnviado','Não enviadas'],['matriz','Matriz'],['filial','Filial']],
  lp: [['enviado','Envio concluído'],['naoEnviado','Envio pendente']],
  sn: [], todos: []
};
function renderFlags(){
  $('flags').innerHTML = FLAGS[state.view].map(function(f){
    return '<button class="chip" data-flag="' + f[0] + '" aria-pressed="' + !!state.flags[f[0]] + '">' + f[1] + '</button>';
  }).join('');
}

function filtrados(){
  var rs = porSelecao(registrosDaVisao()), f = state.flags, b = state.busca.trim().toLowerCase();
  if (f.enviado)    rs = rs.filter(function(r){ return r.enviado; });
  if (f.naoEnviado) rs = rs.filter(function(r){ return !r.envioDispensado && !r.enviado; });
  if (f.matriz)     rs = rs.filter(function(r){ return r.matFil.toUpperCase().indexOf('MATRIZ') >= 0; });
  if (f.filial)     rs = rs.filter(function(r){ return r.matFil.toUpperCase().indexOf('FILIAL') >= 0; });
  if (state.status === 'concluido') rs = rs.filter(function(r){ return r.status === 'concluido'; });
  else if (state.status === 'pendente') rs = rs.filter(function(r){ return r.status === 'parcial' || r.status === 'pendente'; });
  else if (state.status === 'na') rs = rs.filter(function(r){ return r.status === 'na'; });
  if (b) rs = rs.filter(function(r){
    return r.nome.toLowerCase().indexOf(b) >= 0 || r.cod.toLowerCase().indexOf(b) >= 0 || r.resp.toLowerCase().indexOf(b) >= 0;
  });
  return rs.slice().sort(function(a, b2){ return a.nome.localeCompare(b2.nome, 'pt-BR'); });
}

function celCampo(c){
  if (!c) return '';
  if (c.estado === 'ok') return '<span class="f-ok" title="Feito">✓</span>';
  if (c.estado === 'pend') return c.txt ? '<span class="f-txt pend">' + esc(c.txt) + '</span>' : '<span class="f-pend" title="Pendente">—</span>';
  return '<span class="f-txt">' + esc(c.txt || 'n/a') + '</span>';
}
function celProg(r){
  if (r.status === 'na') return '<span class="t-sub">–</span>';
  var cor = r.pct === 100 ? 'ok' : 'parc';
  return '<div class="prog"><div class="seg"><i class="' + cor + '" style="width:' + r.pct + '%"></i></div><span>' + r.pct + '%</span></div>';
}
function celStatus(r){
  var txt = { concluido: r.regime === 'sn' ? 'Enviado' : 'Concluído', parcial:'Parcial', pendente:'Pendente', na:'Não se aplica' }[r.status];
  return '<span class="pill ' + r.status + '">' + txt + '</span>';
}

  ]
};

function temFiltro(){
  return state.sel || state.status !== 'todos' || state.busca.trim() || Object.keys(state.flags).some(function(k){ return state.flags[k]; });
}

function renderTabela(){
  var gs = regimesDaVisao();
  var comAba = gs.filter(function(g){ return urlAba(g, state.mes); });
  var carregados = comAba.filter(function(g){ var e = entrada(g); return e && e.registros; });
  var el = $('tabela');

  if (!comAba.length) {
    $('conta').textContent = '';
    el.innerHTML = '<div class="vazio"><strong>Sem planilha em ' + MES_NOME[state.mes] + '</strong>Escolha outro mês na barra acima.</div>';
    return;
  }
  if (!carregados.length) {
    var falhou = comAba.every(function(g){ var e = entrada(g); return e && e.erro && !e.carregando; });
    $('conta').textContent = '';
    el.innerHTML = falhou
      ? '<div class="vazio"><strong>As planilhas não responderam</strong>Verifique a internet e tente de novo.<br><button class="btn" data-acao="atualizar">Atualizar agora</button></div>'
      : '<div class="vazio">Buscando as planilhas de ' + MES_NOME[state.mes] + '…</div>';
    return;
  }

  var rs = filtrados();
  $('conta').textContent = plural(rs.length, 'empresa', 'empresas');
  $('p-titulo').textContent = VISOES[state.view] + ', ' + MES_NOME[state.mes] + ' de ' + CONFIG.ano;
  $('p-sub').textContent = rotuloSel() + '. ' + plural(rs.length, 'empresa', 'empresas') + '. Gerado em ' + new Date().toLocaleString('pt-BR') + '.';

  if (!rs.length) {
    el.innerHTML = '<div class="vazio"><strong>Nenhuma empresa com esses filtros</strong>' +
      (temFiltro() ? '<button class="btn" data-acao="limpar">Limpar filtros</button>' : 'A planilha deste mês está vazia.') + '</div>';
    return;
  }
  var cols = COLUNAS[state.view];
  var h = '<table><thead><tr>' + cols.map(function(c){ return '<th' + (c[2] ? ' class="' + c[2] + '"' : '') + '>' + c[0] + '</th>'; }).join('') + '</tr></thead><tbody>';
  for (var i = 0; i < rs.length; i++) {
    h += '<tr>';
    for (var k = 0; k < cols.length; k++) h += cols[k][1](rs[i]);
    h += '</tr>';
  }
  el.innerHTML = h + '</tbody></table>';
}

function renderStatus(){
  var es = regimesDaVisao().filter(function(g){ return urlAba(g, state.mes); }).map(entrada).filter(Boolean);
  var dot = $('dot'), txt = $('status-txt');
  if (!es.length) { dot.className = 'dot'; txt.textContent = 'Sem planilha neste mês'; return; }
  if (es.some(function(e){ return e.carregando; })) { dot.className = 'dot load'; txt.textContent = 'Atualizando'; return; }
  var bons = es.filter(function(e){ return e.em && !e.erro; });
  if (!bons.length) { dot.className = 'dot err'; txt.textContent = 'Sem conexão com as planilhas'; return; }
  var antigo = Math.min.apply(null, es.filter(function(e){ return e.em; }).map(function(e){ return e.em; }));
  dot.className = 'dot ' + (bons.length === es.length ? 'ok' : 'err');
  txt.innerHTML = 'Atualizado <span class="quando">às ' + hora(antigo) + '</span>';
}

function render(){
  renderNav(); renderCabecalho(); renderAvisos(); renderRegimes();
  renderPainel(); renderEvolucao(); renderPessoas(); renderFlags(); renderTabela(); renderStatus();
  gravarHash();
}

// ── Endereço (para cada pessoa poder salvar o seu painel nos favoritos) ───
function lerHash(){
  var p = {};
  location.hash.replace(/^#/, '').split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if (i > 0) { try { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
  });
  if (VISOES[p.v]) state.view = p.v;
  if (MESES.indexOf(p.m) >= 0) state.mes = p.m;
  state.sel = p.r ? { tipo:'pessoa', nome:p.r } : p.e ? { tipo:'equipe', nome:p.e } : (p.o && CONFIG.regimes[p.o]) ? { tipo:'outros', nome:p.o } : null;
  state.status = ['concluido','pendente','na'].indexOf(p.s) >= 0 ? p.s : 'todos';
}
function gravarHash(){
  var p = ['v=' + state.view];
  if (state.mes !== mesPadrao()) p.push('m=' + state.mes);   // sem mês fixo, o favorito acompanha o calendário
  if (state.sel) p.push({ pessoa:'r=', equipe:'e=', outros:'o=' }[state.sel.tipo] + encodeURIComponent(state.sel.nome));
  if (state.status !== 'todos') p.push('s=' + state.status);
  try { history.replaceState(null, '', '#' + p.join('&')); } catch (e) {}
}

// ── Tema ──────────────────────────────────────────────────────────────────
function temaAtual(){ return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function aplicarTema(t){
  if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  $('btn-tema').textContent = temaAtual() === 'dark' ? 'Tema claro' : 'Tema escuro';
}

// ── Eventos ───────────────────────────────────────────────────────────────
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-view],[data-mes],[data-pessoa],[data-equipe],[data-outros],[data-status],[data-flag],[data-acao]');
  if (!el) return;
  var d = el.dataset;

  if (d.view != null) {
    if (d.view === state.view) return;
    state.view = d.view; state.flags = {};
    if (state.sel && state.sel.tipo === 'outros' && state.view !== 'todos' && state.view !== state.sel.nome) state.sel = null;
    render(); window.scrollTo(0, 0);
  }
  else if (d.mes != null) {
    if (d.mes === state.mes) return;
    state.mes = d.mes;
    render();
    if (!ultimaBusca[state.mes] || Date.now() - ultimaBusca[state.mes] > INTERVALO) carregarMes(state.mes, false);
  }
  else if (d.pessoa != null) {
    var mesmo = state.sel && state.sel.tipo === 'pessoa' && state.sel.nome === d.pessoa;
    state.sel = (d.pessoa && !mesmo) ? { tipo:'pessoa', nome:d.pessoa } : null;
    render();
  }
  else if (d.outros != null) {
    state.sel = mesmaSel({ tipo:'outros', nome:d.outros }) ? null : { tipo:'outros', nome:d.outros };
    render();
  }
  else if (d.equipe != null) {
    var igual = state.sel && state.sel.tipo === 'equipe' && state.sel.nome === d.equipe;
    state.sel = igual ? null : { tipo:'equipe', nome:d.equipe };
    render();
  }
  else if (d.status != null) {
    state.status = (state.status === d.status) ? 'todos' : d.status;
    renderPainel(); renderTabela(); gravarHash();
  }
  else if (d.flag != null) {
    var liga = !state.flags[d.flag];
    if (d.flag === 'enviado' || d.flag === 'naoEnviado') { state.flags.enviado = state.flags.naoEnviado = false; }
    if (d.flag === 'matriz' || d.flag === 'filial') { state.flags.matriz = state.flags.filial = false; }
    state.flags[d.flag] = liga;
    renderFlags(); renderTabela();
  }
  else if (d.acao === 'atualizar') carregarMes(state.mes, false);
  else if (d.acao === 'imprimir') window.print();
  else if (d.acao === 'limpar') {
    state.sel = null; state.status = 'todos'; state.flags = {}; state.busca = ''; $('busca').value = '';
    render();
  }
  else if (d.acao === 'sair') {
    try { localStorage.removeItem('controle-fiscal-chave'); } catch (e) {}
    location.reload();
  }
  else if (d.acao === 'tema') {
    var novo = temaAtual() === 'dark' ? 'light' : 'dark';
    aplicarTema(novo);
    try { localStorage.setItem('controle-fiscal-tema', novo); } catch (e) {}
  }
});

$('busca').addEventListener('input', function(){ state.busca = this.value; renderTabela(); });

window.addEventListener('hashchange', function(){
  lerHash(); render();
  if (!ultimaBusca[state.mes]) carregarMes(state.mes, false);
});

// Atualização automática: a cada intervalo, e também quando a pessoa volta para a aba
function conferir(){
  renderStatus();
  if (document.hidden) return;
  if (Date.now() - (ultimaBusca[state.mes] || 0) >= INTERVALO) carregarMes(state.mes, true);
}
setInterval(conferir, 20000);
document.addEventListener('visibilitychange', conferir);
window.addEventListener('online', function(){ carregarMes(state.mes, true); });

// ── Início ────────────────────────────────────────────────────────────────
$('ano').textContent = CONFIG.ano;
aplicarTema(temaAtual());
document.body.classList.add('entrada');
setTimeout(function(){ document.body.classList.remove('entrada'); }, 1600);
lerHash();
render();
carregarMes(state.mes, false).then(carregarHistorico);

}
